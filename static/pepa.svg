<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
    <defs>
        <linearGradient id="skyGradient" x1="256" y1="0" x2="256" y2="512" gradientUnits="userSpaceOnUse">
            <stop stop-color="#BBEFFF"/>
            <stop offset="1" stop-color="#EDF9FF"/>
        </linearGradient>
        
        <linearGradient id="waveBodyGradient" x1="50" y1="450" x2="450" y2="100" gradientUnits="userSpaceOnUse">
            <stop offset="0" stop-color="#005C99"/>
            <stop offset="0.5" stop-color="#0088CC"/>
            <stop offset="1" stop-color="#00BFFF"/>
        </linearGradient>

        <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
            <feGaussianBlur in="SourceGraphic" stdDeviation="2" result="blur" />
            <feComposite in="SourceGraphic" in2="blur" operator="over"/>
        </filter>

        <mask id="barrelHoleMask">
            <rect x="0" y="0" width="512" height="512" fill="white"/>
            
            <ellipse cx="270" cy="270" rx="110" ry="75" transform="rotate(-25 270 270)" fill="black"/>
             <ellipse cx="320" cy="220" rx="60" ry="40" transform="rotate(-10 320 220)" fill="black"/>
        </mask>
        </defs>

    <circle cx="256" cy="256" r="256" fill="url(#skyGradient)"/>

    <g filter="url(#softGlow)">
        <path d="M500 350C480 420 420 500 256 512C150 512 60 460 20 380C-10 320 10 250 50 200C100 140 180 150 220 180C250 200 260 240 300 260C350 280 400 240 430 200C460 150 420 100 370 80C320 60 270 70 240 90C210 110 200 140 210 160C220 175 240 170 250 160C270 140 280 120 270 100C250 70 200 50 150 70C80 100 50 180 50 250C50 350 120 450 256 450C350 450 450 400 500 350Z" 
              fill="url(#waveBodyGradient)" 
              mask="url(#barrelHoleMask)"/>
        
        <path d="M450 220C460 180 430 120 380 90C330 60 250 70 210 90C180 110 170 140 180 170C160 150 130 140 100 160C70 180 60 210 70 240C90 220 120 210 140 230C160 250 160 280 150 300C180 280 210 270 240 290C270 310 280 340 270 360C310 330 350 320 390 340C420 355 430 380 430 400C460 360 480 300 470 240C465 230 458 225 450 220Z" fill="white"/>
        
        <circle cx="120" cy="100" r="12" fill="white"/>
        <circle cx="160" cy="70" r="8" fill="white"/>
        <circle cx="420" cy="160" r="15" fill="white" opacity="0.9"/>
        <circle cx="300" cy="50" r="6" fill="white" opacity="0.8"/>
        <circle cx="270" cy="270" r="10" fill="white" opacity="0.6"/>
    </g>
</svg>