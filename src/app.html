<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="%sveltekit.assets%/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Tauri + SvelteKit + Typescript App</title>

    <style>
      /* Reset básico */
      :root { -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale; }
      *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
      html, body { height: 100%; }
      body { line-height: 1.5; -webkit-font-smoothing: antialiased; font-family: 'Roboto Mono', system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial; }
      img, picture, video, canvas, svg { display: block; max-width: 100%; }
      input, button, textarea, select { font: inherit; }
      a { color: inherit; text-decoration: none; }
      ol, ul { list-style: none; }
      table { border-collapse: collapse; border-spacing: 0; }
      fieldset { border: 0; }
    </style>

    %sveltekit.head%
  </head>
  <body data-sveltekit-preload-data="hover">
    <div style="display: contents">%sveltekit.body%</div>
  </body>
</html>
