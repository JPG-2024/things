[package]
name = "notian"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "notian_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-fs = "2.0.0"
tempfile = "3.10.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chromiumoxide = { git = "https://github.com/mattsse/chromiumoxide", features = ["tokio-runtime"], default-features = false, branch = "main" }
tokio = { version = "1", features = ["full"] }
futures = "0.3"
anyhow = "1"
lazy_static = "1.4"
htmd = "0.3"
scraper = "0.24.0"
once_cell = "1.19"
regex = "1.10"
url = "2.5"
dotenv = "0.15"
dirs = "6.0.0"
tauri-plugin-http = "2"
yt-transcript-rs = "0.1.8"
tauri-plugin-sql = { version = "2", features = ["sqlite"] }
uuid = { version = "1", features = ["v4"] }
sha2 = "0.10.9"
text-splitter = { version = "0.28", features = ["markdown", "code"] }
tree-sitter-typescript = "0.23"
reqwest = { version = "0.11", features = ["json", "stream"] }
ollama-rs = { version = "0.3.3", features = ["stream"] }
chromadb = "2.3.0"
tokio-stream = "0.1"
hyper = { version = "0.14", features = ["client", "http1", "http2", "stream"] }
futures-util = "0.3"

[target.x86_64-unknown-linux-gnu]
linker = "cc"
rustflags = ["-C", "link-arg=-fuse-ld=bfd"]
