[package]
name = "notian"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "notian_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-fs = "2.0.0"
tauri-plugin-clipboard-manager = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chromiumoxide = { git = "https://github.com/mattsse/chromiumoxide", features = ["tokio-runtime"], default-features = false, branch = "main" }
tokio = { version = "1", features = ["full"] }
anyhow = "1"
lazy_static = "1.4"
htmd = "0.3"
scraper = "0.24.0"
once_cell = "1.19"
regex = "1.10"
url = "2.5"
urlencoding = "2.1"
dotenv = "0.15"
dirs = "6.0.0"
tauri-plugin-http = "2"
tauri-plugin-sql = { version = "2", features = ["sqlite"] }
uuid = { version = "1", features = ["v4"] }
sha2 = "0.10.9"
text-splitter = { version = "0.28", features = ["markdown", "code"] }
tree-sitter-typescript = "0.23"
reqwest = { version = "0.11", features = ["json", "stream"] }
quick-xml = "0.31"
base64 = "0.21"  # Para decodificar si es necesario
futures-util = "0.3"


# ONNX Runtime
ort = "2.0.0-rc.7"

# Array processing (like NumPy)
ndarray = { version = "0.16", features = ["rayon"] }
rand = "0.8"
rand_distr = "0.4"


# Audio processing
hound = "3.5"
rodio = "0.17"

# CLI argument parsing
clap = { version = "4.5", features = ["derive"] }

# Unicode normalization
unicode-normalization = "0.1"

# System calls
libc = "0.2"

